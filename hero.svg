<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="hero-t hero-d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hero-t">Anmariya Saju</title>
  <desc id="hero-d">Computer science student who builds tested, automated and security-checked data tools.</desc>
  <defs>
    <linearGradient id="h-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="h-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="h-type">
      <rect x="48" y="80" width="170" height="26">
        <animate attributeName="width" values="0;170;170" keyTimes="0;0.35;1" dur="3s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="h-name">
      <rect x="48" y="112" width="520" height="62">
        <animate attributeName="width" values="0;0;520" keyTimes="0;0.35;1" dur="2.2s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="318" rx="20" fill="#0d0e16" stroke="url(#h-hair)" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="318" rx="20" fill="url(#h-dots)"/>
  <circle cx="748" cy="160" r="150" fill="url(#h-glow)"/>

  <!-- status pill -->
  <rect x="48" y="30" width="176" height="28" rx="14" fill="#151726" stroke="#22d3ee" stroke-opacity="0.35"/>
  <circle cx="66" cy="44" r="4" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="44" r="4" fill="none" stroke="#22d3ee" stroke-opacity="0.6">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="49" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#22d3ee">open to collabs</text>

  <!-- typed greeting -->
  <g clip-path="url(#h-type)">
    <text x="48" y="100" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#a78bfa">Hi there, I'm</text>
  </g>
  <rect x="190" y="84" width="9" height="18" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <g clip-path="url(#h-name)">
    <text x="48" y="160" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#h-aurora)">Anmariya Saju</text>
  </g>

  <!-- cycling roles -->
  <text x="48" y="198" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e5e7eb" opacity="1"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>Computer science student</text>
  <text x="48" y="198" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e5e7eb" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" begin="0s" repeatCount="indefinite"/>Data and automation builder</text>
  <text x="48" y="198" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e5e7eb" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.96;1" dur="9s" begin="0s" repeatCount="indefinite"/>Python, FastAPI and Docker</text>

  <!-- pitch -->
  <text x="48" y="232" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9ca3af">I build data pipelines and APIs that are tested,</text>
  <text x="48" y="252" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9ca3af">automated and security-checked.</text>

  <!-- meta row -->
  <circle cx="52" cy="285" r="3.5" fill="#22d3ee"/>
  <text x="62" y="289" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">Germany</text>
  <circle cx="140" cy="285" r="3.5" fill="#a78bfa"/>
  <text x="150" y="289" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">B.Sc. Computer Science, IU</text>
  <circle cx="376" cy="285" r="3.5" fill="#f472b6"/>
  <text x="386" y="289" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">2 projects on GitHub</text>

  <!-- initials badge -->
  <circle cx="748" cy="160" r="92" fill="none" stroke="url(#h-aurora)" stroke-width="2" stroke-dasharray="4 10">
    <animateTransform attributeName="transform" type="rotate" from="0 748 160" to="360 748 160" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="748" cy="160" r="74" fill="#151726" stroke="url(#h-hair)" stroke-width="1.5"/>
  <text x="748" y="179" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#h-aurora)">AS</text>
  <g>
    <circle cx="840" cy="160" r="5" fill="#f472b6"/>
    <animateTransform attributeName="transform" type="rotate" from="0 748 160" to="360 748 160" dur="10s" repeatCount="indefinite"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
